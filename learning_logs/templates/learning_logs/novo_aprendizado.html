{% extends 'learning_logs/base.html' %}
{% block conteudo %}
    <div class="novo_aprendizado">
        <h3>{{ assunto }}</h3>
        <h2>Novo aprendizado</h2>
        <div class="form">
            <form action="{% url 'novo_aprendizado' assunto.id %}" method="post">
                {% csrf_token %}
                <label for="id_aprendizado">Aprendizado:</label>
                <textarea name="aprendizado" cols="400" rows="10" required id="id_aprendizado">
                </textarea>
                <button type="submit">Adicionar aprendizado</button>
            </form>
        </div>
    </div>
{% endblock %}
