{% extends 'learning_logs/base.html' %}
{% block conteudo %}
    <h2>{{ assunto }}</h2>
    <div class="form">
        <h3>Novo aprendizado</h3>
        <form action="{% url 'novo_aprendizado' assunto.id %}" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Adicionar aprendizado</button>
        </form>
    </div>
{% endblock %}
