{% extends 'learning_logs/base.html' %}
{% block conteudo %}
    <div class="assuntos">
        <h2><a href="{% url 'assuntos' %}">Meus assuntos</a></h2>
        <ul type="none">
            {% for assunto in assuntos %}
                <li><a href="{% url 'assunto' assunto.id %}">{{ assunto }}</a></li>
            {% empty %}
                <li>Sem nenhum assunto no momento </li>
            {% endfor %}
        </ul>
    </div>
{% endblock conteudo %}
